name: Refresh data feed

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["js/**", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: data-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-data.mjs
      - name: Commit updated data
        run: |
          git config user.name "gulf-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh forecast data feed"
          git push
