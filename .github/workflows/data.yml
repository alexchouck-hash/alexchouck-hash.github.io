name: Refresh data feed

# Builds the JSON feed and publishes it to the `data-feed` branch as a single
# force-pushed commit, so the feed never accumulates history on main.
# Served at https://raw.githubusercontent.com/<owner>/<repo>/data-feed/index.json

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (Open-Meteo free-tier budget for 440+ resorts)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["js/**", "scripts/**", "ski-conditions/js/**", "ski-conditions/scripts/**", ".github/workflows/data.yml"]

permissions:
  contents: write

concurrency:
  group: data-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch previous feed (normals cache, last good pulls)
        run: git clone --depth 1 --branch data-feed "$REMOTE" feed || mkdir -p feed
      - name: Build feed
        run: node scripts/build-data.mjs
        env:
          FEED_DIR: feed
          NORMALS_BUDGET: "3"
      - name: Precompute ski trail maps
        run: node ski-conditions/scripts/build-runs.mjs
        continue-on-error: true
        env:
          FEED_DIR: feed
      - name: Verify ski forecasts against SNOTEL
        run: node ski-conditions/scripts/verify.mjs
        continue-on-error: true
        env:
          FEED_DIR: feed
      - name: Publish to data-feed branch
        run: |
          cp data/README.md feed/README.md
          cd feed
          rm -rf .git
          git init -q -b data-feed
          git config user.name "gulf-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Forecast data feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "$REMOTE" data-feed
