name: Sargassum model

# Collects satellite sargassum history (NOAA AOML AFAI, 2016→) plus wind and
# current history for every coastal segment, grabs the newest 7-day composite,
# retrains the week-ahead model and publishes everything to the
# `sargassum-data` branch (single force-pushed commit).
# On pull requests it only runs a smoke test against the live endpoints.

on:
  schedule:
    - cron: "41 */3 * * *" # backfill in chunks until complete, then keeps latest fresh
  workflow_dispatch:
    inputs:
      budget:
        description: "Max satellite requests this run"
        default: "80"
  pull_request:
    paths: ["scripts/sargassum/**", "js/sargassum/**", ".github/workflows/sargassum.yml"]

permissions:
  contents: write

concurrency:
  group: sargassum-data
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check data sources
        run: node scripts/sargassum/collect.mjs smoke

  collect-and-train:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      SARG_DIR: sarg
      SARG_BUDGET: ${{ inputs.budget || '80' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch previous history
        run: git clone --depth 1 --branch sargassum-data "$REMOTE" sarg || mkdir -p sarg
      - name: Newest 7-day composite
        run: node scripts/sargassum/collect.mjs latest
        continue-on-error: true
      - name: Satellite history backfill
        run: node scripts/sargassum/collect.mjs backfill
      - name: Wind and current history
        run: node scripts/sargassum/collect.mjs drivers
      - name: Train and score
        run: node scripts/sargassum/train.mjs
      - name: Publish to sargassum-data branch
        run: |
          cd sarg
          rm -rf .git
          git init -q -b sargassum-data
          git config user.name "gulf-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Sargassum history and model $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "$REMOTE" sargassum-data
